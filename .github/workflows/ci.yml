name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Filtro de rutas: tocar `content/` no tiene por qué disparar el build de la webapp.
  changes:
    name: Detectar cambios
    runs-on: ubuntu-latest
    outputs:
      deno: ${{ steps.filter.outputs.deno }}
      webapp: ${{ steps.filter.outputs.webapp }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            deno:
              - 'core/**'
              - 'server/**'
              - 'db/**'
              - 'tools/**'
              - 'content/**'
              - 'deno.json'
              - 'Dockerfile'
              - 'docker-entrypoint.sh'
              - '.github/workflows/**'
            webapp:
              - 'webapp/**'
              - 'scripts/**'
              - '.github/workflows/**'

  # ────────────────────────────────────────────────────────────────────────────────────────────
  # Este job es el ÚNICO gate de `core/` y `server/`.
  #
  # El hook `anti-slop-gate.sh` del framework localiza el proyecto subiendo hasta un `package.json`;
  # un directorio Deno (`deno.json`) no lo encuentra y el hook lo deja pasar sin exigir nada. O sea
  # que la parte Deno NO está cubierta por el hook de commit, por diseño del hook y no por descuido.
  # Si este job se cae o se hace opcional, `core/` y `server/` se quedan sin gate: no tocarlo sin leer
  # esto antes.
  # ────────────────────────────────────────────────────────────────────────────────────────────
  deno:
    name: Núcleo y servidor · check + lint + fmt + tests
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.deno == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.5"
      - run: deno task check
      - run: deno task lint
      - run: deno task fmt
      - run: deno task test

  imagen:
    name: Imagen · el Dockerfile construye
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.deno == 'true' || needs.changes.outputs.webapp == 'true' }}
    steps:
      - uses: actions/checkout@v5
      # Existe porque un despliegue se cayó por algo que NINGÚN otro job podía ver: la etapa de build
      # de la webapp copia sólo `webapp/` y `scripts/`, y su suite importa `core/` para comprobar la
      # portabilidad del núcleo. En local y en CI el fichero estaba a mano; dentro del contexto de
      # Docker, no. El contenedor es un tercer entorno y hay que compilarlo aquí, no en producción.
      - name: docker build
        run: docker build -t ftai:ci .

  contenido:
    name: Contenido · las 14 reglas del contrato
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.deno == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.5"
      - name: Reglas 1-8 y 10-14 (deterministas, sin red)
        run: deno task contenido:validar
      # Regla 9 aparte: necesita red y distingue "enlace muerto" de "bloqueado por el entorno".
      # Un enlace caído de un tercero no debe poner rojo un PR que no lo tocó, así que informa.
      - name: Regla 9 · los enlaces resuelven [informativo]
        continue-on-error: true
        run: deno task contenido:enlaces

  integracion:
    name: Integración · migraciones, carga del grafo y healthcheck
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.deno == 'true' }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ftai
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: ftai_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ftai -d ftai_ci"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://ftai:devpass@localhost:5432/ftai_ci
      # El servidor se niega a arrancar sin secreto de sesión (ver `leerSecreto`). Éste es de CI y
      # sólo vive aquí: la base se tira al acabar el job y no hay nada que rotar.
      BETTER_AUTH_SECRET: secreto-de-ci-de-treinta-y-dos-o-mas-caracteres
      BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.5"

      # Antes de migrar, el healthcheck TIENE que decir que falta el esquema. Si dijera que todo va
      # bien con la base vacía, no estaría mirando nada.
      - name: El health detecta el esquema ausente
        run: |
          mkdir -p webapp/dist && echo "<!doctype html>" > webapp/dist/index.html
          deno run -A server/src/main.ts &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8000/health && break || sleep 1; done
          codigo=$(curl -s -o /tmp/salud.json -w '%{http_code}' http://localhost:8000/health || true)
          cat /tmp/salud.json
          test "$codigo" = "503" || { echo "esperaba 503 con el esquema sin aplicar, hubo $codigo"; exit 1; }
          grep -q '"schema":"missing"' /tmp/salud.json || { echo "esperaba schema:missing"; exit 1; }
          kill %1

      - name: Migrar
        run: deno run -A --node-modules-dir=none db/migrate.ts

      - name: El health pasa a verde tras migrar
        run: |
          deno run -A server/src/main.ts &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8000/health && break || sleep 1; done
          codigo=$(curl -s -o /tmp/salud.json -w '%{http_code}' http://localhost:8000/health)
          cat /tmp/salud.json
          test "$codigo" = "200" || { echo "esperaba 200, hubo $codigo"; exit 1; }
          grep -q '"ok":true' /tmp/salud.json
          grep -q '"schema":"ready"' /tmp/salud.json
          kill %1

      - name: Migrar dos veces es un no-op (idempotencia)
        run: deno run -A --node-modules-dir=none db/migrate.ts

      - name: Cargar el contenido
        run: deno task contenido:cargar

      - name: Cargar dos veces no cambia una fila (idempotencia del cargador)
        run: |
          antes=$(deno eval "
            const p = (await import('npm:postgres@3.4.5')).default(Deno.env.get('DATABASE_URL'));
            const [f] = await p\`select (select count(*) from node) n, (select count(*) from node_prereq) a\`;
            console.log(f.n + '/' + f.a); await p.end();
          ")
          deno task contenido:cargar
          despues=$(deno eval "
            const p = (await import('npm:postgres@3.4.5')).default(Deno.env.get('DATABASE_URL'));
            const [f] = await p\`select (select count(*) from node) n, (select count(*) from node_prereq) a\`;
            console.log(f.n + '/' + f.a); await p.end();
          ")
          echo "antes=$antes despues=$despues"
          test "$antes" = "$despues" || { echo "el cargador no es idempotente"; exit 1; }

      - name: GET /api/graph devuelve el grafo cargado
        run: |
          deno run -A server/src/main.ts &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8000/health && break || sleep 1; done
          curl -s http://localhost:8000/api/graph > /tmp/grafo.json
          deno eval "
            const g = JSON.parse(await Deno.readTextFile('/tmp/grafo.json'));
            console.log(g.branches.length + ' ramas, ' + g.nodes.length + ' nodos');
            if (g.branches.length !== 7 || g.nodes.length !== 5) {
              console.error('esperaba 7 ramas y 5 nodos'); Deno.exit(1);
            }
            const proyecto = g.nodes.find((n) => n.type === 'project');
            if (!proyecto?.rubric?.length) { console.error('el nodo-proyecto llegó sin rúbrica'); Deno.exit(1); }
            if (!g.nodes.some((n) => n.prerequisites.length > 0)) { console.error('no llegó ninguna arista'); Deno.exit(1); }
          "
          kill %1

      # Las dos sondas corren contra el servidor de verdad, con su base y su contenido. Es el gate de
      # V7 (nadie alcanza lo ajeno) y de D3-D6 (cupo, consumo único, idempotencia, desbloqueo). No se
      # hacen con mocks a propósito: lo que se prueba es la composición —sesión, router, consultas—.
      - name: Sondas de autorización (V7) y de reglas (D3-D6)
        run: |
          deno run -A server/src/main.ts &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8000/health && break || sleep 1; done

          # El código del bootstrap es de un solo uso, así que cada sonda estrena base: se vacían las
          # tablas de identidad entre las dos y se acuña uno nuevo. Es más honesto que hacer que las
          # sondas compartan usuario, que las acoplaría entre sí.
          CODIGO_BOOTSTRAP=$(deno task invitar:bootstrap | tail -1) \
            deno run -A tools/sonda-autorizacion.ts

          deno eval "
            const p = (await import('npm:postgres@3.4.5')).default(Deno.env.get('DATABASE_URL'));
            await p\`truncate user_progress, invitation, user_invite_quota, session, account, \"user\" cascade\`;
            await p.end();
          "
          CODIGO_BOOTSTRAP=$(deno task invitar:bootstrap | tail -1) \
            deno run -A tools/sonda-reglas.ts

          kill %1

      - name: El bootstrap se cierra en cuanto hay alguien
        run: |
          # La puerta de servicio no se puede volver a abrir: si esto dejara de fallar, cualquiera con
          # acceso al contenedor podría acuñarse una invitación con el círculo ya montado.
          if deno task invitar:bootstrap > /tmp/boot.txt 2>&1; then
            echo "el bootstrap debería haberse negado y acuñó: $(cat /tmp/boot.txt)"; exit 1
          fi
          grep -q "no vuelve a abrirse" /tmp/boot.txt

  webapp:
    name: Webapp · tsc + anti-slop + build + PWA
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.webapp == 'true' }}
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint anti-slop (ESLint + sonarjs — skill code-anti-slop)
        run: npm run lint
      - name: Build (tsc de la app + tsc del service worker + los dos builds de Vite)
        run: npm run build

      # Los iconos se generan; si el generador cambia y deja de producir lo que el manifiesto declara,
      # el test de abajo se pone rojo. Aquí se comprueba además que el fichero commiteado coincide con
      # lo que el generador produce hoy: un icono editado a mano se detecta.
      - name: Los iconos commiteados son los que genera el script
        run: |
          node ../scripts/generar-iconos.mjs /tmp/iconos
          for f in icon-192.png icon-512.png icon-maskable-512.png; do
            cmp "public/icons/$f" "/tmp/iconos/$f" || { echo "$f difiere del generador"; exit 1; }
          done

      - name: Instalabilidad de la PWA (V5) sobre el build de producción
        run: npm run test

  seguridad:
    name: Guardián · escalera de seguridad (secretos + SAST + deps)
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Instalar gitleaks
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
      - name: Escaneo de secretos
        run: gitleaks detect --config .security-gate-presets/gitleaks.toml --no-banner --redact --verbose

      # Los dos peldaños de abajo FALTABAN pese a que el nombre del job los anunciaba: sólo corría
      # gitleaks, y el preset de semgrep llevaba desde FTAI-B en disco sin que nadie lo invocara. Lo
      # cazó el pase de rol `seguridad` en FTAI-D — precisamente el PR que mete tres dependencias
      # nuevas (better-auth, drizzle-orm, @noble/hashes) en el camino de la contraseña.
      - name: Instalar semgrep y osv-scanner
        run: |
          pipx install semgrep
          curl -sSL -o /usr/local/bin/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.2.4/osv-scanner_linux_amd64
          chmod +x /usr/local/bin/osv-scanner

      # Ruleset VENDORIZADO y pinneado, nunca el registry (`p/…`/`auto`): el veredicto tiene que ser
      # reproducible sin red y sin que nadie de fuera pueda cambiar lo que nos bloquea.
      - name: SAST (semgrep, ruleset vendorizado)
        run: semgrep --config .security-gate-presets/semgrep --metrics=off --error --quiet .

      - name: CVE de dependencias (osv-scanner)
        run: osv-scanner scan source --lockfile=deno.lock --lockfile=webapp/package-lock.json .

      - name: CVE de dependencias (npm audit, high+)
        run: npm audit --audit-level=high --prefix webapp

  qa:
    name: QA · smoke de UI [informativo]
    runs-on: ubuntu-latest
    needs: [changes, webapp]
    if: ${{ needs.changes.outputs.webapp == 'true' }}
    continue-on-error: true
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Servir el build y capturar la portada
        run: npx --yes serve -s dist -l 4173 &
      - name: Los estáticos que declara el manifiesto responden 200
        run: |
          sleep 3
          for ruta in / /manifest.webmanifest /sw.js /icons/icon-192.png /icons/icon-512.png /icons/icon-maskable-512.png; do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:4173$ruta")
            echo "$codigo  $ruta"
            test "$codigo" = "200" || exit 1
          done
